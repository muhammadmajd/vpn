name: vpn_app
description: "small Flutter application consisting of two screens (VPN connection screen, Analytics screen)"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"


dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  sizer: ^3.0.5
  firebase_analytics: ^10.4.3
  lottie: ^2.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.18.1
  #fl_chart: ^0.61.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  fl_chart: ^0.70.2
  mocktail: ^1.0.3
  test: ^1.25.15
  equatable: ^2.0.3
  #flutter_vpn: ^0.13.0
  #mocktail: ^1.0.4

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.0
  build_runner: ^2.4.4
  test: ^1.24.0
  mocktail: ^1.0.3
  sizer: ^3.0.5
  #mocktail: ^1.0.4


  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
     - assets/
     - assets/screenshots/
  #   - images/a_dot_ham.jpeg
